<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لحظة - Lahzah</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.15);
            padding: 2.5rem;
            border-radius: 1.5rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 85%;
        }
        h1 { margin-bottom: 0.8rem; font-size: 2rem; }
        p { opacity: 0.9; font-size: 1.2rem; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="card">
        <h1>✨ تطبيق لحظة </h1>
        <h1>(Moment) ✨</h1>
        <p>أهلاً بكِ في عالم اللحظات الجميلة!</p>
    </div>
</body>
</html>
